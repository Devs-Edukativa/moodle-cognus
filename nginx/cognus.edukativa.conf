server {
    root /var/www/cognus.edukativa.com.br/moodle-cognus;
    index  index.php index.html index.htm;
    server_name  cognus.edukativa.com.br;

    location / {
    try_files $uri $uri/ /index.php?$args;
    }


    location ~ ^(.+\.php)(.*)$ {
        root /var/www/cognus.edukativa.com.br/moodle-cognus;
        fastcgi_split_path_info  ^(.+\.php)(.*)$;
        fastcgi_index            index.php;
        fastcgi_pass              unix:/var/run/php/php8.3-fpm.sock;
        include /etc/nginx/mime.types;
        include                  fastcgi_params;
        fastcgi_param   PATH_INFO       $fastcgi_path_info;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300; # Ajuste conforme necessário
    }

    location /dataroot/ {
        internal;
        alias /var/www/cognus.edukativa.com.br/moodle-data;
    }

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	location ~ /\.ht {
		deny all;
	}


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cognus.edukativa.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cognus.edukativa.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cognus.edukativa.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name  cognus.edukativa.com.br;
    listen 80;
    return 404; # managed by Certbot

}
