# Nginx configuration for Moodle running in Docker container
# Container is running on port 8008 (as configured in Jenkinsfile)

upstream moodle_backend {
    server localhost:8008;
    keepalive 32;
}

server {
    listen 80;
    server_name container.cognus.edukativa.com.br;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name container.cognus.edukativa.com.br;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cognus.edukativa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cognus.edukativa.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Increase client body size for file uploads
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/cognus.edukativa.com.br-access.log;
    error_log /var/log/nginx/cognus.edukativa.com.br-error.log;

    # Proxy configuration for Docker container
    location / {
        proxy_pass http://moodle_backend;
        proxy_http_version 1.1;
        
        # Headers for proper request forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings (important for long operations)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Don't cache
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup and source files
    location ~* (\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
